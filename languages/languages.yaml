# HUSIKA TTS — Language configuration (Sprint 1)
#
# Each language lists which engines can synthesize it.
# preferred_engine is tried first; the router falls back automatically.

languages:
  swa:
    name: "Swahili"
    preferred_engine: "piper"
    piper_support: true
    espeak_support: true
    mms_support: true
    status: "Ready"

  amh:
    name: "Amharic"
    preferred_engine: "mms"
    espeak_support: false
    mms_support: true
    status: "Ready"

  ara:
    name: "Arabic"
    preferred_engine: "piper"
    piper_support: true
    espeak_support: true
    mms_support: true
    status: "Ready"

  som:
    name: "Somali"
    preferred_engine: "mms"
    espeak_support: false
    mms_support: true
    status: "Ready"

  orm:
    name: "Oromo"
    preferred_engine: "mms"
    espeak_support: false
    mms_support: true
    status: "Ready"

  tir:
    name: "Tigrinya"
    preferred_engine: "mms"
    espeak_support: true
    mms_support: true
    status: "Ready"

  lug:
    name: "Luganda"
    preferred_engine: "mms"
    espeak_support: false
    mms_support: true
    status: "Ready"

  kin:
    name: "Kinyarwanda"
    preferred_engine: "mms"
    espeak_support: false
    mms_support: true
    status: "Ready"

  rn:
    name: "Kirundi"
    preferred_engine: "mms"
    espeak_support: false
    mms_support: true
    status: "Ready"

  nue:
    name: "Nuer"
    preferred_engine: "mms"
    espeak_support: false
    mms_support: true
    status: "Ready"

  din:
    name: "Dinka"
    preferred_engine: "mms"
    espeak_support: false
    mms_support: true
    status: "Ready"

  en:
    name: "English"
    preferred_engine: "piper"
    piper_support: true
    espeak_support: true
    mms_support: true
    status: "Ready"

  fr:
    name: "French"
    preferred_engine: "piper"
    piper_support: true
    espeak_support: true
    mms_support: true
    status: "Ready"

  pko:
    name: "Pokoot"
    preferred_engine: "mms"
    espeak_support: false
    mms_support: true
    status: "Ready"

  tuv:
    name: "Turkana"
    preferred_engine: "coqui_vits"
    espeak_support: false
    mms_support: false
    coqui_vits_support: true
    status: "Ready"

  kdj:
    name: "Karamojong"
    preferred_engine: "coqui_vits"
    espeak_support: false
    mms_support: false
    coqui_vits_support: true
    status: "Beta"

  # Toposa (toq): three fine-tuned checkpoints of facebook/mms-tts-kdj, served by
  # the toposa_vits engine. Research prototypes, not validated by native speakers.
  toq-clear:
    name: "Toposa, clear voice"
    preferred_engine: "toposa_vits"
    espeak_support: false
    mms_support: false
    toposa_vits_support: true
    status: "Beta"

  toq-natural:
    name: "Toposa, natural voice"
    preferred_engine: "toposa_vits"
    espeak_support: false
    mms_support: false
    toposa_vits_support: true
    status: "Beta"

  toq-5spk:
    name: "Toposa, five-speaker model"
    preferred_engine: "toposa_vits"
    espeak_support: false
    mms_support: false
    toposa_vits_support: true
    status: "Beta"

  # Pokot (pko): three fine-tuned checkpoints served by the pokot_vits engine.
  # Research prototypes, not validated by native speakers. The plain ``pko`` entry
  # above stays on the public MMS model.
  pko-p1:
    name: "Pokot, P1 (PK03 voice, kdj base)"
    preferred_engine: "pokot_vits"
    espeak_support: false
    mms_support: false
    pokot_vits_support: true
    status: "Beta"

  pko-p2:
    name: "Pokot, P2 (PK03 voice, kpz base)"
    preferred_engine: "pokot_vits"
    espeak_support: false
    mms_support: false
    pokot_vits_support: true
    status: "Beta"

  pko-p3:
    name: "Pokot, P3 (five-speaker model)"
    preferred_engine: "pokot_vits"
    espeak_support: false
    mms_support: false
    pokot_vits_support: true
    status: "Beta"

# Engine metadata
engines:
  piper:
    description: "Piper TTS + ONNX neural synthesis"
    model_source: "huggingface"
    model_base: "rhasspy/piper-voices"
    latency_ms: 500
    quality: "high"

  espeak:
    description: "eSpeak NG — fast, rule-based, offline"
    latency_ms: 100
    quality: "functional"

  mms:
    description: "Meta MMS — neural, 1200+ languages"
    model_source: "huggingface"
    model_base: "facebook/mms-tts"
    latency_ms: 2000
    quality: "good"

  coqui_vits:
    description: "Coqui VITS — in-house fine-tunes for low-resource languages"
    model_source: "huggingface"
    latency_ms: 2000
    quality: "good"

  toposa_vits:
    description: "Toposa VITS — MMS-kdj fine-tunes (clear, natural, five-speaker)"
    model_source: "huggingface"
    model_base: "facebook/mms-tts-kdj"
    latency_ms: 3000
    quality: "experimental"

  pokot_vits:
    description: "Pokot VITS — MMS fine-tunes (P1 kdj, P2 kpz, P3 five-speaker kdj)"
    model_source: "huggingface"
    model_base: "facebook/mms-tts-kdj, facebook/mms-tts-kpz"
    latency_ms: 3000
    quality: "experimental"
